<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Pipeline Test Site</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .badge {
            display: inline-block;
            background-color: #238636;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        h1 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 12px;
        }
        p {
            color: #8b949e;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .status-box {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            color: #58a6ff;
            margin-bottom: 24px;
        }
        .status-box div {
            margin-bottom: 6px;
        }
        .status-box div:last-child {
            margin-bottom: 0;
        }
        .btn {
            background-color: #1f6feb;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #388bfd;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">Deployment Active</span>
        <h1>DevOps Automated Website</h1>
        <p>This web application was successfully packaged by Maven and deployed through the automated Jenkins pipeline.</p>
        
        <div class="status-box">
            <div><strong>Source:</strong> GitHub Repository</div>
            <div><strong>Build Tool:</strong> Apache Maven</div>
            <div><strong>CI Engine:</strong> Jenkins</div>
            <div><strong>Status:</strong> HTTP 200 OK</div>
        </div>

        <button class="btn" onclick="alert('Website is functioning properly!')">Test Live Action</button>
    </div>

</body>
</html>
